<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>FitTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── AUTH GATE ── -->
  <div id="auth-gate">
    <div id="auth-box">
      <div id="auth-logo">FitTrack</div>
      <input id="auth-input" type="password" placeholder="Password" autocomplete="current-password">
      <button id="auth-btn" class="btn btn-primary btn-full">Unlock</button>
      <div id="auth-error"></div>
    </div>
  </div>

  <!-- Bottom Nav (hidden during active workout) -->
  <nav id="main-nav">
    <button class="nav-btn active" data-view="dashboard">
      <span class="nav-icon">⊙</span>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-view="templates">
      <span class="nav-icon">☰</span>
      <span>Templates</span>
    </button>
    <button class="nav-btn" data-view="calendar">
      <span class="nav-icon">◫</span>
      <span>Calendar</span>
    </button>
    <button class="nav-btn" data-view="more">
      <span class="nav-icon">⚙</span>
      <span>More</span>
    </button>
  </nav>

  <!-- ── DASHBOARD ── -->
  <section id="view-dashboard" class="view active">
    <div id="dashboard-content"></div>
  </section>

  <!-- ── ACTIVE WORKOUT ── -->
  <section id="view-workout" class="view">
    <div id="workout-topbar">
      <div id="elapsed-timer">0:00</div>
      <div id="workout-title-bar"></div>
      <div style="display:flex;gap:8px">
        <button id="btn-discard-workout" class="btn btn-secondary btn-sm">✕</button>
        <button id="btn-finish-workout" class="btn btn-success btn-sm">Finish</button>
      </div>
    </div>
    <div id="rest-timer-strip" class="hidden">
      <span id="rest-countdown"></span>
      <div id="rest-progress-track"><div id="rest-progress-fill"></div></div>
      <button id="btn-skip-rest" class="btn-ghost-sm">Skip</button>
    </div>
    <div id="exercise-list"></div>
    <div style="padding: 0 16px 8px;">
      <button class="btn btn-secondary btn-full" onclick="openAddExerciseModal()">+ Add Exercise</button>
    </div>
    <div style="padding: 0 16px 24px;">
      <textarea id="workout-notes" rows="2" placeholder="Workout notes (optional)..."></textarea>
    </div>
  </section>

  <!-- ── TEMPLATES LIST ── -->
  <section id="view-templates" class="view">
    <div id="template-list-content"></div>
  </section>

  <!-- ── TEMPLATE EDITOR ── -->
  <section id="view-template-editor" class="view">
    <div id="template-editor-content"></div>
  </section>

  <!-- ── CALENDAR ── -->
  <section id="view-calendar" class="view">
    <div id="calendar-content"></div>
  </section>

  <!-- ── MORE / SETTINGS ── -->
  <section id="view-more" class="view">
    <div class="view-header"><h2>More</h2></div>
    <div id="more-content"></div>
  </section>

  <!-- ── MODAL (bottom sheet) ── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-sheet">
      <div id="modal-header">
        <h3 id="modal-title"></h3>
        <button id="btn-close-modal" class="btn-icon">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="seeds.js"></script>
  <script src="app.js"></script>
</body>
</html>
